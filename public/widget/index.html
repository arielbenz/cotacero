<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nivel del río en el Puerto de Santa Fe — Cota Cero</title>
    <!-- Canónica propia: los medios lo embeben con ?theme=dark -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://cotacerosf.com/widget" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="preload"
      href="/vendor/fonts/jakarta.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
    <style>
      /* El widget no usa app.css: es la hoja de todo el sitio para una
         tarjeta de 220 px de alto, y esto se embebe en el sitio de otro. Paleta propia, chica, con
         los mismos valores que los tokens de estilos/app.css para que se vean
         como lo mismo. Es una COPIA: node scripts/comprobar.js la compara con
         los tokens (y mide sus pares de texto) y falla si se desincroniza. */
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("/vendor/fonts/jakarta.woff2") format("woff2");
        font-weight: 500 800;
        font-display: swap;
      }
      /* La tarjeta es un panel: --fondo es el --panel de la app. Los colores
         de estado que van como TEXTO son los -texto de la app, calibrados para
         leerse sobre su tinte; las marcas de la regla usan los --linea-*. */
      :root {
        --fondo: #ffffff;
        --texto: #1b262c;
        --tenue: #5f6c72;
        --linea: rgba(27, 38, 44, 0.09);
        --pista: rgba(27, 38, 44, 0.055);
        --agua: #5fc8e8;
        --acento: #127296;
        --alerta: #bf3d05;
        --peligro: #bc3e2a;
        --linea-alerta: #cf440d;
        --linea-evac: #a5271a;
        --alerta-tinte: #ffefe3;
        --peligro-tinte: #fbe9e5;
        --ok: #33765c;
        --ok-tinte: #e6f2ec;
      }
      html[data-theme="dark"] {
        --fondo: #17232a;
        --texto: #e9eef0;
        --tenue: #93a6ad;
        --linea: rgba(233, 238, 240, 0.1);
        --pista: rgba(233, 238, 240, 0.07);
        --agua: #5fc8e8;
        --acento: #5fc8e8;
        --alerta: #e8a33d;
        --peligro: #ef7e6b;
        --linea-alerta: #e8a33d;
        --linea-evac: #e57563;
        --alerta-tinte: rgba(232, 163, 61, 0.14);
        --peligro-tinte: rgba(224, 90, 68, 0.16);
        --ok: #54ae90;
        --ok-tinte: rgba(79, 168, 139, 0.15);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--fondo);
        color: var(--texto);
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      /* Centrado en el alto que le dé el iframe: el código recomienda 220 px
         y el contenido mide menos, así que el aire se reparte arriba y abajo
         en vez de quedar todo al pie. */
      .w {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        min-height: 100vh;
        padding: 16px 18px;
      }
      .cab {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--tenue);
      }
      .cab svg {
        flex: none;
      }
      /* La tendencia va en la cabecera, a la derecha. «▲ +3 cm» y no «cm/día»:
         el INA puede saltearse una lectura y ahí el delta abarca dos días. */
      /* Sin color de estado: ver .mov-rio en estilos/app.css. */
      .delta {
        margin-left: auto;
        color: var(--texto);
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .delta[hidden] {
        display: none;
      }
      .fila {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .nivel {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .unidad {
        font-size: 17px;
        font-weight: 700;
        color: var(--tenue);
      }
      /* El estado, al lado del número: la alerta y la evacuación siempre con
         «de la ciudad», y con el dato vencido no dice ninguna de las dos —una
         alerta de hace tres días con la cara de una de hoy es peor que nada—. */
      .estado {
        margin-left: auto;
        align-self: center;
        padding: 4px 10px;
        border-radius: 99px;
        background: var(--ok-tinte);
        color: var(--ok);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.25;
        text-align: center;
        /* En una columna angosta parte el texto en dos renglones adentro de
           la píldora, al lado del número: debajo no entraría en los 220 px. */
        min-width: 0;
      }
      .estado.alerta {
        background: var(--alerta-tinte);
        color: var(--alerta);
      }
      .estado.evac {
        background: var(--peligro-tinte);
        color: var(--peligro);
      }
      .estado.viejo {
        background: var(--pista);
        color: var(--tenue);
      }
      /* La regla: 0 a 8 m, con el agua y las dos marcas oficiales. Es la misma
         escala que usa la app, así el número del widget y el de la app se leen
         en el mismo instrumento. */
      .regla {
        position: relative;
        height: 12px;
        border-radius: 99px;
        background: var(--pista);
        overflow: hidden;
      }
      .agua {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        border-radius: 99px;
        background: var(--agua);
      }
      .marca {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
      }
      /* Dato vencido: el agua rayada en gris, como en la app y en el sitio. */
      .agua.viejo {
        background: repeating-linear-gradient(
          135deg,
          var(--tenue) 0 6px,
          transparent 6px 12px
        );
        opacity: 0.45;
      }
      /* Las marcas de hidrómetro: cada 10 cm, 50 cm y 1 m. Es COPIA de
         .marcas-rio.h de css/app.css, que el widget no puede leer: si cambia
         una, cambia la otra. Mide 1 px más que la regla para que entre la
         marca de 8 m. */
      .marcas {
        height: 8px;
        margin: 2px -1px 0 0;
        background-image:
          repeating-linear-gradient(
            to right,
            var(--texto) 0 1px,
            transparent 1px calc((100% - 1px) / 8)
          ),
          repeating-linear-gradient(
            to right,
            var(--tenue) 0 1px,
            transparent 1px calc((100% - 1px) / 16)
          ),
          repeating-linear-gradient(
            to right,
            var(--linea) 0 1px,
            transparent 1px calc((100% - 1px) / 80)
          );
        background-size:
          100% 8px,
          100% 6px,
          100% 4px;
        background-position: left top;
        background-repeat: no-repeat;
      }
      .pie {
        display: flex;
        align-items: baseline;
        gap: 8px 16px;
        flex-wrap: wrap;
        padding-top: 10px;
        border-top: 1px solid var(--linea);
        font-size: 12px;
        line-height: 1.4;
        color: var(--tenue);
      }
      .pie b {
        color: var(--texto);
        font-weight: 700;
      }
      .pie .umbrales {
        flex: 1;
        min-width: 200px;
      }
      .pie .umbrales b {
        font-variant-numeric: tabular-nums;
      }
      .pie .u-alerta {
        color: var(--alerta);
      }
      .pie .u-evac {
        color: var(--peligro);
      }
      /* Con el dato vencido, la fecha es lo primero que hay que leer. */
      .pie .fecha.viejo {
        color: var(--alerta);
        font-weight: 700;
      }
      /* El crédito va entero y en una línea: es la condición 1 de /para-medios
         y la trazabilidad del número que el medio está publicando. */
      .pie .credito {
        flex: none;
        white-space: nowrap;
      }
      .pie a {
        color: var(--acento);
        font-weight: 700;
        text-decoration: none;
      }
      .pie a:hover {
        text-decoration: underline;
      }
      @media (max-width: 380px) {
        .pie {
          flex-wrap: wrap;
          gap: 6px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="w">
      <div class="cab">
        <svg width="16" height="16" viewBox="0 0 60 60" aria-hidden="true">
          <defs>
            <clipPath id="wm">
              <rect x="0" y="33" width="60" height="27" />
            </clipPath>
          </defs>
          <circle
            cx="30"
            cy="30"
            r="21"
            fill="var(--agua)"
            clip-path="url(#wm)" />
          <circle
            cx="30"
            cy="30"
            r="21"
            fill="none"
            stroke="currentColor"
            stroke-width="7" />
          <line
            x1="2"
            y1="33"
            x2="58"
            y2="33"
            stroke="currentColor"
            stroke-width="4.5"
            stroke-linecap="round" />
        </svg>
        Río Paraná · Puerto de Santa Fe
        <span class="delta" id="delta" hidden></span>
      </div>

      <div class="fila">
        <span class="nivel" id="nivel">—</span>
        <span class="unidad">m</span>
        <span class="estado viejo" id="estado">Buscando el dato</span>
      </div>

      <div class="regla" role="img" aria-hidden="true">
        <span class="agua" id="agua"></span>
        <span
          class="marca"
          id="m-alerta"
          style="background: var(--linea-alerta)"></span>
        <span
          class="marca"
          id="m-evac"
          style="background: var(--linea-evac)"></span>
      </div>
      <div class="marcas" aria-hidden="true"></div>

      <div class="pie">
        <span class="umbrales"
          >Alerta <b class="u-alerta" id="u-alerta">5,30</b> · Evacuación
          <b class="u-evac" id="u-evac">5,70</b> ·
          <span class="fecha" id="fecha">—</span></span
        >
        <span class="credito"
          >Datos: <b>INA</b> ·
          <a href="/" target="_blank" rel="noopener">vía Cota Cero →</a></span
        >
      </div>
    </div>
    <script src="/lib/comun-clasico.js" defer></script>
    <script src="/widget/widget.js" defer></script>
  </body>
</html>
